    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Civora — Sign Up</title>
</head>
<body class="home">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="fa-solid fa-city me-2"></i>Civora
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="report.html">Report Issue</a></li>
        <li class="nav-item"><a class="nav-link" href="alerts.html">Live Alerts</a></li>

      <a href="login.html" class="btn btn-success">Login</a>
    </div>
  </div>
</nav>

<div class="container mt-5 mb-5" style="max-width: 480px;">
  <h3 class="mb-3 text-center">Create an Account</h3>

  <form>
    <div class="mb-3">
      <label for="fullname" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="fullname" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required>
    </div>

    <div class="mb-3">
      <label for="signupPassword" class="form-label">Password</label>
      <input type="password" class="form-control" id="signupPassword" required>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" required>
    </div>

    <button type="submit" class="btn btn-success w-100">Sign Up</button>

    <p class="text-center mt-3">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </form>
</div>

<footer class="bg-dark text-light py-5 mt-5">
  <div class="container">
    <p class="text-center text-white-50 mb-0">© 2026 Civora. All Rights Reserved.</p>
  </div>
</footer>

</body>
</html>
